name: build-macos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macos-14 è un runner Apple Silicon (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Test della logica di conversione
        run: python -m pytest -q

      - name: Build dell'app con PyInstaller
        run: pyinstaller --noconfirm --clean packaging/MarkItDown.spec

      - name: Creazione del DMG
        run: bash scripts/make_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MarkItDown-macos-arm64
          path: dist/*.dmg
